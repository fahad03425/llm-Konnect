<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Glassmorphic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Emerald-Cyan-Purple AI Core Gradient -->
    <linearGradient id="aiPrismGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="facetBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="facetCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  <rect x="4" y="4" width="56" height="56" rx="13" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.25" />

  <!-- Background Ambient Glow -->
  <circle cx="32" cy="32" r="18" fill="#10b981" opacity="0.2" filter="url(#glow)" />

  <!-- Main AI Energy Prism Shape -->
  <g filter="url(#glow)">
    <!-- Bottom Facet -->
    <polygon points="29,32 23,54 47,27 34,27" fill="url(#facetBot)" opacity="0.95" />
    <!-- Top Facet -->
    <polygon points="34,8 17,32 29,32 31,21" fill="url(#facetTop)" opacity="0.95" />
    <!-- Core Energy Center -->
    <polygon points="34,8 31,21 47,27 43,8" fill="url(#facetCore)" opacity="0.9" />

    <!-- Inner Highlight Accents -->
    <polyline points="34,8 17,32 29,32" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
    <polyline points="29,32 23,54 47,27" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
  </g>

  <!-- Neural Sparkle Nodes -->
  <circle cx="15" cy="18" r="1.5" fill="#38bdf8" />
  <circle cx="49" cy="17" r="2" fill="#a855f7" />
  <circle cx="14" cy="45" r="1.8" fill="#10b981" />
  <circle cx="49" cy="44" r="2.2" fill="#06b6d4" />
</svg>